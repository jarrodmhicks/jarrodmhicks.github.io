name: Build and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *' # rebuilds daily so "upcoming" tags and stats update on their own

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the footer can show when data/ last changed
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch citation counts
        run: node tools/fetch-citations.js
        continue-on-error: true # if OpenAlex is down, the site still deploys, just without counts
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Build the site
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
